<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E2A38" />
<title>The Docket</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="The Docket" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root {
    --ink: #1E2A38; --ink-soft: #4B5866; --ink-faint: #94978F;
    --paper: #EDECE3; --paper-raised: #F6F5EF;
    --brass: #9C7A34; --brick: #8B3E3A; --moss: #4F6650; --line: #D9D6C9;
  }
  [data-theme="slate-sage"] {
    --ink: #28352F; --ink-soft: #516058; --ink-faint: #93A199;
    --paper: #E8EDE6; --paper-raised: #F3F6F1;
    --brass: #6E8F6A; --brick: #A15C4B; --moss: #4A7A5A; --line: #D2DBCE;
  }
  [data-theme="midnight"] {
    --ink: #E7E5DD; --ink-soft: #B7B4A9; --ink-faint: #7C7A70;
    --paper: #15181D; --paper-raised: #1E2229;
    --brass: #C6A15C; --brick: #C0685F; --moss: #6FA37E; --line: #2E333B;
  }
  [data-theme="parchment"] {
    --ink: #3A2E22; --ink-soft: #6B5A45; --ink-faint: #A6957E;
    --paper: #F4ECDD; --paper-raised: #FBF6EC;
    --brass: #B08130; --brick: #9C4A3C; --moss: #5C7A4E; --line: #E3D5BC;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--ink); background: var(--paper);
    -webkit-tap-highlight-color: transparent;
  }
  .icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }
  button, .icon-btn, .text-btn, .nav-btn, .cal-btn, .task-delete, .fab, .finance-mode-btn, .theme-swatch, .primary-btn {
    transition: transform 0.12s ease, opacity 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  .fab:active { transform: scale(0.92); }
  @media (prefers-reduced-motion: reduce) {
    button, .icon, .chev, .modal-sheet { transition: none !important; animation: none !important; }
  }
  #app {
    max-width: 460px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column; background: var(--paper);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app-header { display: flex; align-items: center; gap: 10px; padding: 20px 20px 16px; border-bottom: 1px solid var(--line); background: var(--paper-raised); }
  .header-mark { width: 36px; height: 36px; border-radius: 9px; background: var(--ink); color: var(--paper-raised); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 6px rgba(30,42,56,0.25); }
  .app-header h1 { font-family: 'Newsreader', serif; font-weight: 600; font-size: 20px; margin: 0; letter-spacing: 0.1px; }
  .header-date { margin: 1px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .app-body { flex: 1; overflow-y: auto; padding: 16px 16px 88px; position: relative; }
  .section { margin-bottom: 26px; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .section-bar { width: 3px; height: 14px; border-radius: 2px; display: inline-block; }
  .section h2 { font-size: 13.5px; font-weight: 500; color: var(--ink-soft); margin: 0; letter-spacing: 0.15px; }
  .section-body { display: flex; flex-direction: column; gap: 8px; }
  .empty-row { font-size: 13px; color: var(--ink-faint); padding: 10px 2px; font-style: italic; }
  .empty-state { text-align: center; padding: 60px 24px 40px; }
  .empty-state .icon { color: var(--ink-faint); margin-bottom: 12px; }
  .empty-state h3 { font-family: 'Newsreader', serif; font-size: 19px; font-weight: 600; margin: 0 0 8px; }
  .empty-state p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.55; max-width: 300px; margin-left: auto; margin-right: auto; }
  button { font-family: inherit; }
  .primary-btn { background: var(--ink); color: var(--paper-raised); border: none; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px rgba(30,42,56,0.18); }
  .task-row { display: flex; align-items: flex-start; gap: 9px; background: var(--paper-raised); border: 1px solid var(--line); border-left-width: 3px; border-radius: 10px; padding: 11px; box-shadow: 0 1px 3px rgba(30,42,56,0.05); }
  .task-check { background: none; border: none; padding: 1px 0 0; cursor: pointer; flex-shrink: 0; color: var(--ink-faint); }
  .task-main { flex: 1; text-align: left; background: none; border: none; padding: 0; cursor: pointer; min-width: 0; }
  .task-text { font-size: 14px; line-height: 1.35; }
  .task-text-done { text-decoration: line-through; color: var(--ink-faint); }
  .task-meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
  .task-case { font-size: 11.5px; color: var(--ink-soft); background: var(--paper); padding: 1px 6px; border-radius: 4px; }
  .task-due { font-size: 11.5px; color: var(--ink-faint); display: inline-flex; align-items: center; gap: 2px; }
  .task-due-overdue { color: var(--brick); font-weight: 500; }
  .task-delete, .cal-btn { background: none; border: none; color: var(--ink-faint); cursor: pointer; padding: 2px; flex-shrink: 0; display: inline-flex; align-items: center; }
  .court-row { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; text-align: left; cursor: pointer; box-shadow: 0 1px 3px rgba(30,42,56,0.05); }
  .court-row-title { font-size: 13.5px; font-weight: 500; }
  .court-row-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .court-row-date { font-size: 12px; color: var(--brass); font-weight: 500; white-space: nowrap; margin-left: 10px; }
  .case-list { display: flex; flex-direction: column; gap: 11px; }
  .case-card { background: var(--paper-raised); border: 1px solid var(--line); border-left-width: 3px; border-radius: 11px; overflow: hidden; box-shadow: 0 1px 4px rgba(30,42,56,0.06); }
  .case-card-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 13px; background: none; border: none; cursor: pointer; text-align: left; }
  .case-title { font-family: 'Newsreader', serif; font-size: 16px; font-weight: 500; }
  .case-sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .case-card-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 10px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-label { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .chev { color: var(--ink-faint); transition: transform 0.18s ease; display: inline-flex; }
  .chev-open { transform: rotate(90deg); }
  .inline-icon-text { display: inline-flex; align-items: center; gap: 5px; }
  .registrar-line { display: flex; align-items: center; font-size: 12px; color: var(--ink-soft); padding: 0 0 10px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .finance-actions { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .case-next-date { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--brass); padding: 0 13px 12px; margin-top: -4px; }
  .case-detail { padding: 4px 13px 14px; border-top: 1px solid var(--line); }
  .case-notes { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 12px 0; }
  .case-tasks-label, .case-updates-label { font-size: 11.5px; color: var(--ink-faint); margin: 10px 0 7px; }
  .case-detail .task-row { margin-bottom: 6px; }
  .case-actions { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .text-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--ink-soft); font-size: 12.5px; cursor: pointer; padding: 0; }
  .text-btn-danger { color: var(--brick); }
  .fab { position: fixed; right: calc(50% - 230px + 16px); bottom: 82px; width: 50px; height: 50px; border-radius: 50%; background: var(--ink); color: var(--paper-raised); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 14px rgba(30,42,56,0.32); z-index: 5; }
  @media (max-width: 460px) { .fab { right: 16px; } }
  .bottom-nav { display: flex; border-top: 1px solid var(--line); background: var(--paper-raised); position: sticky; bottom: 0; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 calc(9px + env(safe-area-inset-bottom)); background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 10.5px; }
  .nav-btn.active { color: var(--brass); font-weight: 500; }
  .nav-icon { display: flex; }
  @keyframes docket-slide-up { from { transform: translateY(24px); opacity: 0.4; } to { transform: translateY(0); opacity: 1; } }
  @keyframes docket-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal-overlay { position: fixed; inset: 0; background: rgba(30,42,56,0.44); display: flex; align-items: flex-end; z-index: 20; animation: docket-fade-in 0.15s ease; }
  .modal-sheet { width: 100%; max-width: 460px; margin: 0 auto; background: var(--paper-raised); border-radius: 18px 18px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; box-shadow: 0 -6px 24px rgba(30,42,56,0.2); animation: docket-slide-up 0.2s cubic-bezier(0.2,0.8,0.3,1); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-head h2 { font-family: 'Newsreader', serif; font-size: 18px; font-weight: 600; margin: 0; }
  .modal-close { background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 5px; display: flex; border-radius: 50%; }
  .modal-close:active { background: var(--paper); }
  .modal-form { display: flex; flex-direction: column; gap: 13px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 12px; color: var(--ink-soft); }
  .field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; font-size: 14px; font-family: inherit; background: var(--paper); color: var(--ink); width: 100%; }
  .field textarea { resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--brass); outline-offset: 0; }
  .log-hint { font-size: 13px; color: var(--ink-soft); line-height: 1.5; padding: 6px 2px; }
  .log-entry { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 9px; box-shadow: 0 1px 3px rgba(30,42,56,0.05); }
  .log-entry-date { font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }
  .log-entry p { margin: 0 0 6px; font-size: 13.5px; }
  .log-entry ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-soft); }
  .install-banner { background: var(--paper-raised); border: 1px solid var(--brass); border-radius: 10px; padding: 11px 13px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .install-banner button { background: var(--ink); color: var(--paper-raised); border: none; border-radius: 7px; padding: 7px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .header-actions { margin-left: auto; display: flex; gap: 4px; }
  .icon-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 7px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .icon-btn:active { background: var(--paper); }
  .search-bar { display: flex; align-items: center; gap: 8px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 14px; }
  .search-bar input { border: none; background: none; outline: none; flex: 1; font-size: 14px; color: var(--ink); font-family: inherit; }
  .search-bar span { color: var(--ink-faint); font-size: 14px; }
  .settings-group { margin-bottom: 24px; }
  .settings-group h3 { font-family: 'Newsreader', serif; font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .settings-group p.settings-desc { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 12px; line-height: 1.5; }
  .theme-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .theme-swatch { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; }
  .theme-swatch-preview { width: 56px; height: 40px; border-radius: 8px; border: 2px solid var(--line); position: relative; overflow: hidden; }
  .theme-swatch-preview.selected { border-color: var(--brass); }
  .theme-swatch span { font-size: 10.5px; color: var(--ink-soft); text-align: center; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .settings-row:last-child { border-bottom: none; }
  .settings-row-label { font-size: 13.5px; }
  .settings-row-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
  .toggle { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track { position: absolute; inset: 0; background: var(--line); border-radius: 12px; cursor: pointer; transition: background 0.15s; }
  .toggle input:checked + .toggle-track { background: var(--brass); }
  .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper-raised); transition: transform 0.15s; pointer-events: none; }
  .toggle input:checked ~ .toggle-thumb { transform: translateX(18px); }
  .days-input { width: 64px; }
  [data-theme-preview="ink-brass"] { background: linear-gradient(135deg, #1E2A38 50%, #9C7A34 50%); }
  [data-theme-preview="slate-sage"] { background: linear-gradient(135deg, #28352F 50%, #6E8F6A 50%); }
  [data-theme-preview="midnight"] { background: linear-gradient(135deg, #15181D 50%, #C6A15C 50%); }
  [data-theme-preview="parchment"] { background: linear-gradient(135deg, #F4ECDD 50%, #B08130 50%); }
  .finance-mode-tabs { display: flex; gap: 8px; margin-bottom: 6px; }
  .finance-mode-btn { flex: 1; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; padding: 9px 0; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  .finance-mode-btn.active { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
  .finance-totals { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 3px rgba(30,42,56,0.05); }
  .finance-totals > div { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); }
  .finance-totals > div b { color: var(--ink); font-weight: 500; }
  .finance-total-row { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; font-size: 14px !important; }
  .finance-total-row span { color: var(--ink) !important; font-weight: 500; }
  .finance-total-row b { font-family: 'Newsreader', serif; font-size: 16px; }
  .finance-range-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .finance-range-row input { flex: 1; }
  .expense-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .expense-row { display: flex; align-items: center; gap: 8px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  .expense-row-main { flex: 1; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; }
  .expense-cat { font-size: 11.5px; color: var(--brass); font-weight: 500; }
  .expense-note { font-size: 13px; color: var(--ink-soft); }
  .expense-amount { font-size: 13.5px; font-weight: 500; white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
